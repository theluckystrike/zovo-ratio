name: Test Build Extension

on:
  push:
    branches:
      - main
    paths:
      - Extensions/combined/**
      - .github/workflows/build.yaml
  pull_request:
    branches:
      - main
    paths:
      - Extensions/combined/**
      - .github/workflows/build.yaml

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Public Supabase publishable key (client-side by design, shipped in every build).
      # Same project and key that zovo-skiplist already commits in package.json.
      SUPABASE_ANON_KEY: sb_publishable_RG4IVO9Qm23_xPzdQjdFPQ_QHBwbOLv

    defaults:
      run:
        working-directory: ./Extensions/combined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryd-chrome
          path: ./Extensions/combined/dist/chrome

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryd-firefox
          path: ./Extensions/combined/dist/firefox

      - name: Upload Safari artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryd-safari
          path: ./Extensions/combined/dist/safari
